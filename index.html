  if (!pos) return `Help, I need assistance. ${fell}My location could not be found. (Emergency message from Campus Navigator)`;
  const { latitude, longitude, accuracy } = pos.coords;
  const link = `https://maps.google.com/?q=${latitude.toFixed(6)},${longitude.toFixed(6)}`;
  return `Help, I am at ${link} (accurate to about ${Math.round(accuracy)} m). ${fell}(Emergency message from Campus Navigator)`;
}

function sosUrl(s, message) {
  if (s.method === 'whatsapp') {
    return `https://wa.me/${s.number.replace(/\D/g, '')}?text=${encodeURIComponent(message)}`;
  }
  // "?&body=" works on both Android ("?body=") and iPhone ("&body=")
  return `sms:${s.number.replace(/[^\d+]/g, '')}?&body=${encodeURIComponent(message)}`;
}

// reason: 'button' | 'fall'
async function sendSOS(reason) {
  if (sosBusy) return;
  const s = loadSos();
  if (!s.number) {
    speak('No SOS contact is saved. Ask someone to set up the SOS contact.', true);
    openSosSetup();
    return;
  }
  sosBusy = true;
  try {
    if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
    speak('Sending SOS. Finding your location.', true);
    let pos = null;
    try { pos = await getPosition(); } catch (e) { console.warn('SOS location error:', e); }
    const message = buildSosMessage(pos, reason);
    const app = s.method === 'whatsapp' ? 'WhatsApp' : 'Messages';
    speak(`${pos ? '' : 'Location not found. '}Opening ${app}. Press Send to send the SOS.`, true,
          `Opening ${app}. Press Send to send:\n${message}`);
    // Let the announcement start, then hand over to the messaging app
    await new Promise(r => setTimeout(r, 2500));
    location.href = sosUrl(s, message);
  } finally {
    sosBusy = false;
  }
}

document.getElementById('btnSos').addEventListener('click', () => sendSOS('button'));

// ---- Fall countdown ---------------------------------------------
function onFallDetected() {
  const s = loadSos();
  if (!s.fall || !s.number || fallTimer || sosBusy) return;
  fallSecsLeft = FALL_CANCEL_SECS;
  fallAlertEl.hidden = false;
  document.getElementById('fallCancel').focus();
  if (navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 500]);
  speak(`Fall detected. Sending SOS in ${FALL_CANCEL_SECS} seconds. Tap the screen if you are OK.`, true);
  updateFallText();
  fallTimer = setInterval(() => {
    fallSecsLeft--;
    updateFallText();
    if (fallSecsLeft <= 0) {
      endFallCountdown();
      sendSOS('fall');
    } else if (fallSecsLeft === 10 || fallSecsLeft === 5) {
      if (navigator.vibrate) navigator.vibrate(400);
      speak(`Sending SOS in ${fallSecsLeft} seconds.`, true);
    }
  }, 1000);
}

function updateFallText() {
  fallTextEl.textContent = `Fall detected.\nSending SOS in ${fallSecsLeft} seconds.`;
}

function endFallCountdown() {
  if (fallTimer) { clearInterval(fallTimer); fallTimer = null; }
  fallAlertEl.hidden = true;
}

document.getElementById('fallCancel').addEventListener('click', () => {
  endFallCountdown();
  speak('SOS cancelled.', true);
});
document.getElementById('fallSendNow').addEventListener('click', () => {
  endFallCountdown();
  sendSOS('fall');
});

// ---- Motion: fall detection --------------------------------------
function onSafetyMotion(e) {
  const now = Date.now();
  const ag = e.accelerationIncludingGravity;
  if (!ag || ag.x == null) return;
  const total = Math.hypot(ag.x || 0, ag.y || 0, ag.z || 0);
  // Fall = free fall long enough, then a hard impact soon after
  if (total < FALL_FREEFALL_MS2) {
    if (!freeFallStart) freeFallStart = now;
  } else {
    if (freeFallStart && now - freeFallStart >= FALL_FREEFALL_MIN_MS) freeFallEndedAt = now;
    freeFallStart = 0;
    if (freeFallEndedAt && total > FALL_IMPACT_MS2 && now - freeFallEndedAt <= FALL_IMPACT_WINDOW_MS) {
      freeFallEndedAt = 0;
      onFallDetected();
    }
  }
}

// Fall detection starts as soon as the page opens. iPhone only allows
// them after a tap (it asks permission then), so there they start on
// the first tap anywhere in the app.
function startSafetyMotion() {
  if (safetyListening) return;
  const DME = window.DeviceMotionEvent;
  if (!DME) return;
  safetyListening = true;
  const listen = () => window.addEventListener('devicemotion', onSafetyMotion);
  if (typeof DME.requestPermission === 'function') {
    DME.requestPermission()
      .then(r => { if (r === 'granted') listen(); else safetyListening = false; })
      .catch(() => { safetyListening = false; });
  } else {
    listen();
  }
}
document.addEventListener('click', startSafetyMotion);
if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission !== 'function') {
  startSafetyMotion();
}
</script>
